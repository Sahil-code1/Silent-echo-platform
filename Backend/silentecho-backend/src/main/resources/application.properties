spring.application.name=silentecho-backend

# ---- Database (MySQL). All credentials come from the environment; nothing is committed. ----
spring.datasource.url=${SILENTECHO_DB_URL:jdbc:mysql://localhost:3306/silentecho_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SILENTECHO_DB_USERNAME:silentecho_user}
spring.datasource.password=${SILENTECHO_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${SILENTECHO_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- Server, sessions and cookies ----
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=SE_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SILENTECHO_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${SILENTECHO_COOKIE_SAMESITE:lax}

# ---- Uploads: hard limit of 2 MB per file (validated again in EvidenceValidator) ----
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# ---- SilentEcho secrets and settings (environment only) ----
silentecho.hmac-secret=${SILENTECHO_HMAC_SECRET}
silentecho.encryption-key=${SILENTECHO_ENCRYPTION_KEY}
silentecho.evidence-dir=${SILENTECHO_EVIDENCE_DIR:./data/evidence}
silentecho.allowed-origins=${SILENTECHO_ALLOWED_ORIGINS:http://127.0.0.1:5500,http://localhost:5500}
silentecho.login-max-failures=5
silentecho.login-window=15m
silentecho.login-lockout=15m
